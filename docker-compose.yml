services:
  spotify-tracker:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - SECURE_COOKIES=true
    restart: on-failure

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - spotify-tracker
    restart: on-failure

volumes:
  caddy_data:
  caddy_config:
